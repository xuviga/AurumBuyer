name: build

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - java: '21'
            profile: ''
            label: legacy
          - java: '25'
            profile: '-Platest'
            label: latest
    name: JDK ${{ matrix.java }} (${{ matrix.label }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build (verify)
        run: mvn -B ${{ matrix.profile }} clean verify
