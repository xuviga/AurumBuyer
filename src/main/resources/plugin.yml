name: AurumBuyer
version: 1.1.0
main: com.xuvigan.aurumbuyer.AurumBuyer
api-version: 1.16
author: XuViGaN
description: Advanced item buyer (collector) for Paper 1.16.1 - 1.21.x by XuViGaN
website: https://github.com/xuviga/AurumBuyer
softdepend:
  - Vault
  - PlaceholderAPI

commands:
  aurum:
    description: AurumBuyer main command
    usage: /aurum help
    aliases:
      - ab
      - aurumbuyer
      - аурум

permissions:
  aurum.use:
    description: Access to the /aurum command
    default: true
  aurum.sell:
    description: Sell items to the buyer
    default: true
  aurum.shop:
    description: Use the aurum shop
    default: true
  aurum.auto:
    description: Use auto-sell
    default: true
  aurum.boosters:
    description: Use boosters and the ulta bonus
    default: true
  aurum.top:
    description: View leaderboards
    default: true
  aurum.admin:
    description: Full administrative access
    default: op
